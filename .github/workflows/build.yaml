name: Build

'on':
  'push':
    'tags':
      - 'v*'
    'branches':
      - '*'
  'pull_request':
  'workflow_dispatch':

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOCURL_NETWORK_INTEGRATION: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install markdownlint-cli
        run: npm install --global markdownlint-cli@0.49.1

      - name: Lint Markdown
        run: npx --no-install markdownlint-cli .

      - name: Lint Go packages
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --modules-download-mode=vendor

      - name: Verify modules
        run: go mod verify

      - name: Vet packages
        run: go vet -mod=vendor ./...

      - name: Run tests without race instrumentation
        run: go test -count=1 -mod=vendor ./...

      - name: Run tests
        run: |-
          go test -race -count=1 -v '-bench=.' -mod=vendor '-coverprofile=coverage.txt' -covermode=atomic ./...

      - name: Run vendored QUIC transport-parameter wire tests
        run: |-
          go test -race -count=1 -v -mod=vendor -run 'Test(ReorderTransportParametersKeepsGreaseAndUnlistedOrder|TransportParametersMarshalUsesConfiguredOrder|TransportParametersMarshalPreservesExplicitZeroValues)$' github.com/quic-go/quic-go/internal/wire

      - name: Build all packages
        run: go build -mod=vendor ./...

      - name: Verify clean checkout
        shell: pwsh
        run: |-
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            $status | Write-Error
            exit 1
          }

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: "success() && matrix.os == 'ubuntu-latest'"
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt

  build:
    needs:
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Prepare environment
        run: |-
          RELEASE_VERSION="${GITHUB_REF##*/}"
          if [[ "${RELEASE_VERSION}" != v* ]]; then RELEASE_VERSION='dev'; fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      # Win
      - run: GOOS=windows GOARCH=386 VERSION=${RELEASE_VERSION} make release
      - run: GOOS=windows GOARCH=amd64 VERSION=${RELEASE_VERSION} make release

      # MacOS
      - run: GOOS=darwin GOARCH=amd64 VERSION=${RELEASE_VERSION} make release

      # MacOS ARM
      - run: GOOS=darwin GOARCH=arm64 VERSION=${RELEASE_VERSION} make release

      # Linux X86
      - run: GOOS=linux GOARCH=386 VERSION=${RELEASE_VERSION} make release
      - run: GOOS=linux GOARCH=amd64 VERSION=${RELEASE_VERSION} make release

      # Linux ARM
      - run: GOOS=linux GOARCH=arm GOARM=6 VERSION=${RELEASE_VERSION} make release
      - run: GOOS=linux GOARCH=arm64 VERSION=${RELEASE_VERSION} make release

      # Linux MIPS/MIPSLE
      - run: GOOS=linux GOARCH=mips GOMIPS=softfloat VERSION=${RELEASE_VERSION} make release
      - run: GOOS=linux GOARCH=mipsle GOMIPS=softfloat VERSION=${RELEASE_VERSION} make release

      # FreeBSD X86
      - run: GOOS=freebsd GOARCH=386 VERSION=${RELEASE_VERSION} make release
      - run: GOOS=freebsd GOARCH=amd64 VERSION=${RELEASE_VERSION} make release

      # FreeBSD ARM/ARM64
      - run: GOOS=freebsd GOARCH=arm GOARM=6 VERSION=${RELEASE_VERSION} make release
      - run: GOOS=freebsd GOARCH=arm64 VERSION=${RELEASE_VERSION} make release

      - run: ls -l build/gocurl-*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: See [CHANGELOG.md](./CHANGELOG.md) for the list of changes.
          draft: false
          prerelease: false
          files: |
            build/gocurl-*.tar.gz
            build/gocurl-*.zip
